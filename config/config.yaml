# mj-agent 默认配置（可被环境变量覆盖）
app_name: mj-agent
env: dev

redis:
  url: redis://10.0.12.31:6379
  max_connections: 32
  stream_block_ms: 5000
  stream_read_count: 100

database:
  url: postgresql+asyncpg://postgres:postgres@10.0.12.31:5432/mjagent
  user: postgres
  password: postgres
  pool_size: 10
  echo: false

gateway:
  host: 0.0.0.0
  port: 8080
  sse_keepalive_seconds: 15.0
  sse_max_idle_seconds: 90.0
  sse_default_retry_ms: 3000
  # CORS：允许的前端来源（覆盖默认；用 env MJ_GATEWAY_CORS_ALLOW_ORIGINS 更安全）
  # 开发环境默认放 Next.js 3000；生产请改成实际前端域名
  cors_allow_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_methods: ["*"]
  cors_allow_headers: ["*"]
  cors_allow_credentials: true

worker:
  queue: tasks:default
  concurrency: 4
  poll_block_ms: 1000
  event_flush_interval_ms: 50
  default_max_iters: 10

llm:
  provider: openai                         
  model: qwen-plus
  # model: qwen3-14b
  # api_key: 填入自己的APIKey
  # base_url: 填入自己对应厂商的BaseURL
  temperature: 0.2
  max_tokens: null

mcp:
  enabled: true
  emit_tool_events: true
  allowlist: []
  denylist: []
  # servers:
  servers:
    - name: wzmj-server
      transport: streamable_http
      enabled: true
      url: http://10.0.104.54:8002/mcp
      headers: {}
      connect_timeout_seconds: 10.0
      request_timeout_seconds: 60.0
      tool_call_timeout_seconds: 120.0 
    - name: nanchang_mcp
      transport: streamable_http
      enabled: true
      url: http://10.0.104.71:8765/mcp
      headers: {}
      connect_timeout_seconds: 10.0
      request_timeout_seconds: 60.0
      tool_call_timeout_seconds: 120.0
    - name: ncmj-server
      transport: streamable_http
      enabled: true
      url: http://10.0.104.126:8000/mcp
      headers: {}
      connect_timeout_seconds: 10.0
      request_timeout_seconds: 60.0
      tool_call_timeout_seconds: 120.0
