[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mj-agent"
version = "0.1.0"
description = "多 Agent 异步流式系统（FastAPI + LangGraph + Redis Stream + MCP）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mj-agent team" }]
keywords = ["agent", "mcp", "langgraph", "sse", "streaming", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 生产依赖（开发依赖走 requirements-dev.txt）
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "redis==5.1.1",
    "SQLAlchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "PyYAML==6.0.2",
    "langgraph==0.2.34",
    "langchain-core==0.3.7",
    "langchain-openai==0.2.2",
    "langchain-anthropic==0.2.2",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fakeredis==2.24.1",
    "httpx==0.27.2",
    "ruff==0.6.8",
    "black==24.10.0",
    "mypy==1.13.0",
]

[project.scripts]
# 注意：app.gateway.router 提供 build_app()，需用 --factory 模式启动：
#   uvicorn app.gateway.router:build_app --factory
mj-worker = "app.worker.runner:main"

[project.urls]
Repository = "https://example.com/mj-agent"

# ---- 工具配置 ----
[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # 行长交给 formatter

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
